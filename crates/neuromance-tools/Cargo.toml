[package]
name = "neuromance-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Tool execution framework for Neuromance LLM library"

[lints]
workspace = true

[features]
git = ["dep:git2"]

[dependencies]
# vendored-libgit2 builds the bundled C sources: hermetic under the nix
# sandbox and immune to nixpkgs/libgit2-sys version skew (libgit2-sys pins a
# minimum system libgit2 that nixpkgs periodically trails).
git2 = { workspace = true, optional = true, features = ["vendored-libgit2"] }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dashmap.workspace = true
globset.workspace = true
grep.workspace = true
ignore.workspace = true
tempfile.workspace = true
tracing.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
rmcp.workspace = true
url.workspace = true

neuromance-common = { workspace = true }
neuromance-context = { workspace = true }
